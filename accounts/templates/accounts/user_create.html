{% extends "base.html" %}
{% block title %}Add user{% endblock %}
{% block content %}
  <h1>Add user</h1>
  <p class="page-sub">Creates an account that can log in right away.</p>
  <form method="post" novalidate class="form-narrow">
    {% csrf_token %}
    {% include "includes/form_fields.html" %}
    <button type="submit" class="btn btn-primary">Create user</button>
    <a class="btn btn-quiet" href="{% url 'user_list' %}">Cancel</a>
  </form>
{% endblock %}
