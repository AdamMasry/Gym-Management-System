{% extends "base.html" %}
{% block title %}Edit user{% endblock %}
{% block content %}
  <h1>{{ target.get_full_name|default:target.email }}</h1>
  <p class="page-sub">{{ target.email }}</p>
  <form method="post" novalidate class="form-narrow">
    {% csrf_token %}
    {% include "includes/form_fields.html" %}
    <button type="submit" class="btn btn-primary">Save</button>
    <a class="btn btn-quiet" href="{% url 'user_list' %}">Back to users</a>
  </form>
{% endblock %}
