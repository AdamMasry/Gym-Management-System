{% extends "accounts/auth_base.html" %}
{% block title %}Log in{% endblock %}
{% block auth %}
  <h1>Log in</h1>
  <p class="lead-line">Use the email you signed up with.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "includes/form_fields.html" %}
    <button type="submit" class="btn btn-primary">Log in</button>
  </form>
  <p class="auth-switch">No account yet? <a href="{% url 'signup' %}">Sign up</a></p>
{% endblock %}
