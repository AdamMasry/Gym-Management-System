{% extends "base.html" %}
{% block title %}Edit profile{% endblock %}
{% block content %}
  <h1>Edit profile</h1>
  <p class="page-sub">Your name, phone, and photo. Your email and role can't be changed here.</p>
  {% if user.photo %}
    <img src="{{ user.photo.url }}" alt="Your profile photo" width="96" class="mb-3 rounded">
  {% endif %}
  <form method="post" enctype="multipart/form-data" novalidate class="form-narrow">
    {% csrf_token %}
    {% include "includes/form_fields.html" %}
    <button type="submit" class="btn btn-primary">Save</button>
  </form>
{% endblock %}
